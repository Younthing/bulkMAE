name: BiocCheck

# Advisory Bioconductor checklist on main and manual dispatch, not on PRs.
# Fails only on BiocCheck errors; warnings and notes are reported.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bioccheck:
    name: Ubuntu (R release, BiocCheck)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      BULKMAE_RUN_ONLINE_TESTS: "false"
      TESTTHAT_PARALLEL: "false"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          dependencies: '"hard"'
          cache: false
          extra-packages: |
            any::BiocCheck
            any::knitr
            any::rmarkdown
          needs: check

      - name: Run BiocCheck
        run: |
          result <- BiocCheck::BiocCheck(".", `quit-with-status` = FALSE)
          errors <- result$error
          if (length(errors)) {
            stop(paste(c("BiocCheck errors:", errors), collapse = "\n"), call. = FALSE)
          }
        shell: Rscript {0}
