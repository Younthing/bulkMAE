url: https://younthing.github.io/bulkMAE/

# Build the site into a dedicated subdirectory instead of the default `docs/`.
# The repository keeps tracked, non-site content under `docs/agents/`, so a
# bare `docs/` destination makes pkgdown's `clean_site()` abort with
# "is non-empty and not built by pkgdown". `docs/_site` is ignored by both
# .gitignore (`docs/*`) and .Rbuildignore (`^docs$`); the workflow deploys it
# to the gh-pages branch.
destination: docs/_site

template:
  bootstrap: 5

# The package is not published on CRAN or Bioconductor yet. Disabling the
# auto-generated sidebar keeps site builds from probing those package indexes.
home:
  sidebar: false

articles:
  - title: Tutorials
    navbar: Tutorials
    contents:
      - getting-started
      - airway-qc-de
      - enrichment-analysis
  - title: Guides
    navbar: Guides
    contents:
      - naming-migration

reference:
  - title: Plotting
    desc: Standard ggplot2 views of QC, embeddings, differential expression, enrichment, and assays.
    contents:
      - has_concept("plotting")
  - title: Functions
    contents:
      - lacks_concepts("plotting")
